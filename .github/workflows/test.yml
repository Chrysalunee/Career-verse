name: Career-Verse tests and preview build

on:
  push:
    branches:
      - main
      - "launch/**"
    paths:
      - "Career-verse-main/**"
      - "index.html"
      - "css/**"
      - "js/**"
      - "data/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "Career-verse-main/**"
      - "index.html"
      - "css/**"
      - "js/**"
      - "data/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Career-verse-main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run game logic tests
        run: npm test
      - name: Upload tested website preview
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: career-verse-preview-${{ github.sha }}
          path: Career-verse-main/
          if-no-files-found: error
          retention-days: 7
